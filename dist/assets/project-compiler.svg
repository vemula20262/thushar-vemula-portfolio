<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><rect width="900" height="500" fill="#dce8ef"/><g fill="#25483c" font-family="Arial,sans-serif"><text x="45" y="48" font-size="13" letter-spacing="2">COMPILER / SOURCE TO EXECUTION</text><text x="45" y="98" font-size="29" font-weight="600">From polynomial code to a result.</text></g><rect x="130" y="142" width="640" height="182" rx="16" fill="#294b3d"/><text x="165" y="190" font-family="monospace" font-size="22" fill="#f4d8a5">POLY F(x) = x² + 2x;</text><text x="165" y="237" font-family="monospace" font-size="22" fill="#c7d9cc">INPUT → PARSE → VALIDATE</text><text x="165" y="284" font-family="monospace" font-size="22" fill="#ece6f5">F(3) = 15</text><rect x="45" y="370" width="250" height="65" rx="13" fill="#fff" fill-opacity=".8"/><text x="63" y="408" font-family="Arial" font-size="16" fill="#25483c">01  Parse declarations</text><rect x="325" y="370" width="250" height="65" rx="13" fill="#fff" fill-opacity=".8"/><text x="343" y="408" font-family="Arial" font-size="16" fill="#25483c">02  Validate semantics</text><rect x="605" y="370" width="250" height="65" rx="13" fill="#fff" fill-opacity=".8"/><text x="623" y="408" font-family="Arial" font-size="16" fill="#25483c">03  Evaluate polynomials</text><text x="45" y="474" font-family="Arial" font-size="12" fill="#52695d">CONCEPT DIAGRAM · NOT AN APPLICATION SCREENSHOT</text></svg>